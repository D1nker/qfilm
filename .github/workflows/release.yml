name: Release

# Pousser une étiquette comme v0.1.0 construit qFilm pour macOS (Apple silicon et Intel), Windows et Linux, puis
# joint les installeurs à une version en BROUILLON : rien n'est public tant que vous ne la publiez pas
# (la page web ne propose que des versions publiées).
# Lancé à la main (onglet Actions, « Run workflow »), il construit tout sans rien publier : les installeurs
# restent téléchargeables dans les résultats du lancement, de quoi essayer le chantier sans étiquette.
# Mode d'emploi : docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: The tag and every manifest must say the same version
        env:
          # Par une variable d'environnement : un nom d'étiquette est une entrée de l'utilisateur, il ne doit pas
          # être collé dans la commande.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-version.mjs "$TAG"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    permissions:
      contents: write # joindre les installeurs à la version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
          # Construit sur le même exécuteur : Rust sait compiler pour l'autre architecture.
          - name: macOS, Intel
            os: macos-latest
            target: x86_64-apple-darwin
          # La plus ancienne image Ubuntu : les paquets tournent ainsi sur des systèmes plus anciens aussi.
          - name: Linux
            os: ubuntu-22.04
            target: ""
          - name: Windows
            os: windows-latest
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build, and attach the installers to a draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature « ad hoc » : un Mac à puce Apple refuse de lancer un binaire qui n'est pas signé du tout.
          # Ce n'est pas la signature d'un développeur Apple : macOS demandera encore une confirmation.
          # Pour signer et notariser (compte Apple Developer), voir docs/RELEASING.md.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tauriScript: npm run tauri --
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # Sans étiquette (lancement à la main) : on construit, on ne publie rien.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: qFilm __VERSION__
          releaseBody: |
            Free and open source. Download the installer for your system below.

            These builds are not code-signed yet, so your system will ask you to confirm the first launch:
            see https://d1nker.github.io/qfilm/#download
          releaseDraft: true
          prerelease: false

      - name: Keep the installers of a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: qfilm-${{ runner.os }}-${{ matrix.target || 'native' }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
          if-no-files-found: error
