{%- set m = [((photo.short * p.width / 100) | round | int), 1] | max -%}
{%- set W = photo.w + m * 2 -%}
{%- set H = photo.h + m * 2 -%}
<svg xmlns="http://www.w3.org/2000/svg" width="{{ W }}" height="{{ H }}" viewBox="0 0 {{ W }} {{ H }}">
  <rect width="{{ W }}" height="{{ H }}" fill="{{ p.color }}"/>

  <!-- Repères lus par l'application (non dessinés). -->
  <rect id="photo" x="{{ m }}" y="{{ m }}" width="{{ photo.w }}" height="{{ photo.h }}" display="none"/>
  <rect id="caption-area" x="0" y="{{ photo.h + m }}" width="{{ W }}" height="{{ m }}" display="none"/>
</svg>
