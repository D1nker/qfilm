[package]
name = "qfilm-core"
version.workspace = true
description = "qFilm imaging engine: decode, looks, frames, captions, export"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta.workspace = true
# Formats restreints : évite de compiler les encodeurs AVIF/EXR inutiles ici
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1.10.0"
# Même version que celle que `image` embarque déjà : une seule copie dans le binaire.
moxcms = "0.8"
base64 = "0.23.1"
thiserror = "2.0.20"
ab_glyph = "0.2.32"
resvg = { version = "0.49.0", default-features = false, features = ["text", "raster-images"] }
minijinja = { version = "3.0.3", features = ["fuel", "serde", "loop_controls"] }
roxmltree = "0.21.2"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
