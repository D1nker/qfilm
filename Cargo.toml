[workspace]
members = ["crates/core", "desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["D1nker"]
license = "MIT"
repository = "https://github.com/D1nker/qfilm"
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
# Le traitement pixel est inutilisable sans optimisation des dépendances
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
