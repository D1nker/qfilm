[package]
name = "app"
version = "0.1.0"
description = "A lightweight photo editor"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.88"


[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Formats restreints : évite de compiler les encodeurs AVIF/EXR inutiles ici
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1.10.0"
base64 = "0.23.1"
thiserror = "2.0.20"
tauri-plugin-dialog = "2.7.2"
ab_glyph = "0.2.32"
resvg = { version = "0.49.0", default-features = false, features = ["text", "raster-images"] }
minijinja = { version = "3.0.3", features = ["fuel", "serde", "loop_controls"] }
roxmltree = "0.21.2"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
tauri-plugin-opener = "2.5.5"

[profile.dev]
# Le traitement pixel est inutilisable sans optimisation des dépendances
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
